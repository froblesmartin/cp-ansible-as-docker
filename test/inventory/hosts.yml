---
all:
  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_become: true
    ansible_ssh_private_key_file: /home/ansible/.ssh/id_ed25519

    # Community edition: no enterprise components, so nothing here needs a
    # licence and Control Center stays out of the picture.
    confluent_server_enabled: false
    installation_method: package

    # Nothing in this topology uses the CLI, and skipping it keeps the test
    # off S3.
    confluent_cli_download_enabled: false

kafka_controller:
  hosts:
    node1:

kafka_broker:
  hosts:
    node2:
