name: Build and push

# The content lives on version branches (7.9, 8.3, ...), not on main, so that
# is what triggers a build. Tags come from the Dockerfile's CP_VERSION.
on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'ssh-config'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Which images to build'
        type: choice
        default: both
        options: [both, standard, airgapped]
      tag_latest:
        description: 'Also tag as latest'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VARIANTS: ${{ inputs.variants || 'both' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The air-gapped image pulls ~2.5 GB of artifacts at build time.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Read CP version from the Dockerfile
        id: version
        run: |
          set -euo pipefail
          cp_version=$(grep -m1 '^ARG CP_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "$cp_version" ]; then
            echo "::error::could not read ARG CP_VERSION from the Dockerfile"
            exit 1
          fi
          echo "cp_version=${cp_version}" >> "$GITHUB_OUTPUT"
          echo "cp_minor=${cp_version%.*}" >> "$GITHUB_OUTPUT"
          echo "Building Confluent Platform ${cp_version}"

      # Docker Hub is optional: without DOCKERHUB_TOKEN the job still publishes
      # to GHCR, so forks and PRs do not fail on a missing secret.
      - name: Resolve target registries
        id: registries
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'froblesmartin/cp-ansible' }}
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/${DOCKERHUB_REPOSITORY,,}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo '::warning::DOCKERHUB_TOKEN is not set, pushing to GHCR only'
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags for the standard image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.cp_version }}
            type=raw,value=${{ steps.version.outputs.cp_minor }}
            type=raw,value=latest,enable=${{ inputs.tag_latest == true }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=cp-ansible as Docker
            org.opencontainers.image.description=Ansible control node for Confluent Platform ${{ steps.version.outputs.cp_version }}

      - name: Tags for the air-gapped image
        id: meta-airgapped
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          flavor: suffix=-airgapped,onlatest=true
          tags: |
            type=raw,value=${{ steps.version.outputs.cp_version }}
            type=raw,value=${{ steps.version.outputs.cp_minor }}
            type=raw,value=latest,enable=${{ inputs.tag_latest == true }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=cp-ansible as Docker (air-gapped)
            org.opencontainers.image.description=Ansible control node for Confluent Platform ${{ steps.version.outputs.cp_version }}, with the install artifacts bundled

      - name: Build and push the standard image
        if: env.VARIANTS != 'airgapped'
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile pins FROM --platform=linux/amd64, so there is only
          # one platform to build.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=cp-ansible
          cache-to: type=gha,mode=max,scope=cp-ansible

      - name: Smoke test the standard image
        if: env.VARIANTS != 'airgapped'
        run: |
          set -euo pipefail
          image=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
          docker run --rm "$image" ansible --version
          docker run --rm "$image" ansible-galaxy collection list confluent.platform
          docker run --rm "$image" ssh -G example.invalid \
            | grep -E '^(stricthostkeychecking accept-new|userknownhostsfile )'

      # The air-gapped image needs room for ~2.5 GB of artifacts plus the layer
      # export; the preinstalled toolchains are the cheapest thing to drop.
      - name: Free up disk space
        if: env.VARIANTS != 'standard'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build and push the air-gapped image
        if: env.VARIANTS != 'standard'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: INCLUDE_ARTIFACTS=true
          tags: ${{ steps.meta-airgapped.outputs.tags }}
          labels: ${{ steps.meta-airgapped.outputs.labels }}
          annotations: ${{ steps.meta-airgapped.outputs.annotations }}
          # Reuses the layers below the artifact step; not exported, since the
          # bundled artifacts would fill the 10 GB Actions cache on their own.
          cache-from: type=gha,scope=cp-ansible

      - name: Summary
        run: |
          {
            echo '### Pushed images'
            echo
            echo '```'
            if [ "${VARIANTS}" != 'airgapped' ]; then echo '${{ steps.meta.outputs.tags }}'; fi
            if [ "${VARIANTS}" != 'standard' ]; then echo '${{ steps.meta-airgapped.outputs.tags }}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
