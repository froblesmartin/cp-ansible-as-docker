name: Build and push

# The content lives on version branches (7.9, 8.3, ...), not on main, so that
# is what triggers a build. Tags come from the Dockerfile's CP_VERSION.
on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'ssh-config'
      - 'ansible.cfg'
      - 'test/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Also tag as latest'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Read CP version from the Dockerfile
        id: version
        run: |
          set -euo pipefail
          cp_version=$(grep -m1 '^ARG CP_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "$cp_version" ]; then
            echo "::error::could not read ARG CP_VERSION from the Dockerfile"
            exit 1
          fi
          echo "cp_version=${cp_version}" >> "$GITHUB_OUTPUT"
          echo "cp_minor=${cp_version%.*}" >> "$GITHUB_OUTPUT"
          echo "Building Confluent Platform ${cp_version}"

      # Docker Hub is optional: without DOCKERHUB_TOKEN the job still publishes
      # to GHCR, so forks and PRs do not fail on a missing secret.
      - name: Resolve target registries
        id: registries
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'froblesmartin/cp-ansible' }}
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/${DOCKERHUB_REPOSITORY,,}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo '::warning::DOCKERHUB_TOKEN is not set, pushing to GHCR only'
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.cp_version }}
            type=raw,value=${{ steps.version.outputs.cp_minor }}
            type=raw,value=latest,enable=${{ inputs.tag_latest == true }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=cp-ansible as Docker
            org.opencontainers.image.description=Ansible control node for Confluent Platform ${{ steps.version.outputs.cp_version }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile pins FROM --platform=linux/amd64, so there is only
          # one platform to build.
          platforms: linux/amd64
          load: true
          push: false
          tags: cp-ansible:test
          cache-from: type=gha,scope=cp-ansible
          cache-to: type=gha,mode=max,scope=cp-ansible

      - name: Integration test
        timeout-minutes: 25
        run: |
          set -euo pipefail
          docker compose -f test/compose.yaml build keygen
          docker compose -f test/compose.yaml run --rm --no-TTY control

      # systemd logs to the journal, not to the container's stdout, so
      # `compose logs` on these nodes is empty. Go in and fetch it.
      - name: Managed node diagnostics
        if: failure()
        run: |
          docker compose -f test/compose.yaml ps -a
          for node in node1 node2; do
            id=$(docker compose -f test/compose.yaml ps -aq "$node") || continue
            [ -n "$id" ] || continue
            echo "::group::${node} healthcheck probes"
            docker inspect --format '{{json .State.Health}}' "$id" | jq . || true
            echo "::endgroup::"
            echo "::group::${node} units and sshd journal"
            docker exec "$id" systemctl --failed --no-pager || true
            docker exec "$id" journalctl -u sshd -b --no-pager -n 200 || true
            echo "::endgroup::"
          done

      - name: Tear the test environment down
        if: always()
        run: docker compose -f test/compose.yaml down -v --remove-orphans

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=cp-ansible

      - name: Summary
        run: |
          {
            echo '### Pushed images'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
